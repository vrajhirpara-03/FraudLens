name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run reproducible tests without private training data
        run: python -m pytest backend/tests/test_health.py backend/tests/test_statements.py ml/tests/test_validate.py
      # Prediction integration tests require the intentionally excluded training data/model.
      # Run those separately in a trusted environment with the model artifact available.

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
